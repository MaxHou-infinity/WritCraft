<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">笔触 WritCraft</title>
  <desc id="desc">深蓝色写作工作台中，项目文件、正文和关系图谱共同组成一个 AI 写作空间。</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset=".48" stop-color="#312e81"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a5b4fc"/>
      <stop offset=".5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1440" height="620" rx="34" fill="url(#field)"/>
  <circle cx="1240" cy="70" r="260" fill="#22d3ee" opacity=".07"/>
  <circle cx="160" cy="560" r="330" fill="#818cf8" opacity=".08"/>
  <path d="M0 464 C240 390 350 560 590 488 S980 366 1440 448" fill="none" stroke="#e0e7ff" stroke-opacity=".07" stroke-width="2"/>

  <g transform="translate(86 78)">
    <text x="0" y="44" fill="#e0e7ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif" font-size="20" font-weight="600" letter-spacing="5">WRITCRAFT · AI WRITING IDE</text>
    <text x="0" y="130" fill="#ffffff" font-family="'Songti SC','Noto Serif SC',serif" font-size="72" font-weight="700">让 AI 进入写作现场</text>
    <text x="0" y="202" fill="url(#ink)" font-family="'Songti SC','Noto Serif SC',serif" font-size="56" font-weight="700">但不替你成为作者</text>
    <text x="2" y="258" fill="#c7d2fe" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif" font-size="22">项目理解 · 段落改写 · 差异审阅 · 一致性图谱</text>

    <g transform="translate(0 326)" filter="url(#shadow)">
      <rect width="758" height="156" rx="18" fill="#f8fafc"/>
      <rect width="188" height="156" rx="18" fill="#eef2ff"/>
      <rect x="170" width="18" height="156" fill="#eef2ff"/>
      <circle cx="28" cy="30" r="6" fill="#818cf8"/>
      <text x="44" y="36" fill="#3730a3" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700">我的写作项目</text>
      <text x="28" y="72" fill="#4338ca" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">◆ edit.md</text>
      <text x="28" y="102" fill="#64748b" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">▾ chapters</text>
      <text x="46" y="130" fill="#64748b" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">01-开篇.md</text>
      <text x="220" y="34" fill="#0f172a" font-family="'Songti SC','Noto Serif SC',serif" font-size="18" font-weight="700">写作不是生成答案，而是建立判断。</text>
      <rect x="220" y="54" width="474" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="220" y="76" width="430" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="220" y="98" width="458" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="220" y="120" width="328" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="210" y="47" width="5" height="87" rx="2.5" fill="#6366f1"/>
      <rect x="615" y="111" width="112" height="27" rx="13.5" fill="#312e81"/>
      <text x="637" y="130" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="700">审阅修改</text>
    </g>
  </g>

  <g transform="translate(980 122)" filter="url(#glow)">
    <path d="M110 48 L54 132 L128 198 L76 292 M110 48 L210 112 L128 198 L226 256 M210 112 L292 56 M210 112 L318 174 L226 256 L310 334 M76 292 L164 360 L226 256" fill="none" stroke="#a5f3fc" stroke-opacity=".52" stroke-width="2"/>
    <path d="M54 132 L18 222 M128 198 L164 360 M318 174 L350 254" fill="none" stroke="#c4b5fd" stroke-opacity=".42" stroke-width="2"/>
    <g fill="#67e8f9" stroke="#ecfeff" stroke-width="2">
      <circle cx="110" cy="48" r="10"/><circle cx="54" cy="132" r="8"/><circle cx="128" cy="198" r="13"/>
      <circle cx="210" cy="112" r="11"/><circle cx="226" cy="256" r="14"/><circle cx="318" cy="174" r="8"/>
      <circle cx="76" cy="292" r="9"/><circle cx="164" cy="360" r="8"/><circle cx="310" cy="334" r="10"/>
    </g>
    <g fill="#fdba74" stroke="#fff7ed" stroke-width="2">
      <circle cx="292" cy="56" r="7"/><circle cx="18" cy="222" r="7"/><circle cx="350" cy="254" r="8"/>
    </g>
    <text x="86" y="420" fill="#c7d2fe" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" letter-spacing="3">CONSISTENCY GRAPH</text>
  </g>
</svg>
